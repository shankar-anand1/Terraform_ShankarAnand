<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Submit form</title>
</head>
<body style="font-family:Arial;max-width:480px;margin:40px auto">
  <h2>Submit details</h2>
  <form method="POST" action="/send">
    <p>Name<br><input name="name" style="width:100%"></p>
    <p>Email<br><input name="email" type="email" style="width:100%"></p>
    <p>Message<br><textarea name="message" rows="4" style="width:100%"></textarea></p>
    <p><button type="submit">Submit</button></p>
  </form>
</body>
</html>
